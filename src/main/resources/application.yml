spring:
  application:
    name: rapidos
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rapidos}
    username: ${SPRING_DATASOURCE_USERNAME:rapidos}
    password: ${SPRING_DATASOURCE_PASSWORD:rapidos}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true

server:
  port: ${SERVER_PORT:8080}

rapidos:
  # Qué adaptador de infraestructura está activo por puerto (el aplicativo no lee esto).
  # pedidos / despacho / menú → JDBC con spring.datasource (PostgreSQL).
  persistencia:
    ubicacion: ${RAPIDOS_PERSISTENCIA_UBICACION:memoria}
  menu:
    cache-ttl: ${MENU_CACHE_TTL:5m}
  workers:
    max-size: ${RAPIDOS_WORKERS_MAX_SIZE:4}
    core-size: ${RAPIDOS_WORKERS_CORE_SIZE:2}
    queue-capacity: ${RAPIDOS_WORKERS_QUEUE_CAPACITY:100}
  ubicacion:
    ttl-segundos: ${UBICACION_TTL_SEGUNDOS:30}
    ventana-medidas: ${UBICACION_VENTANA_MEDIDAS:20}
    minimo-mediciones: ${UBICACION_MINIMO_MEDICIONES:5}
    firebase:
      url: ${FIREBASE_DB_URL:}
      auth-token: ${FIREBASE_AUTH_TOKEN:}
      timeout-ms: ${FIREBASE_TIMEOUT_MS:2000}
