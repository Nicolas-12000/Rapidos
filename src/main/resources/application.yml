spring:
  application:
    name: rapidos
  datasource:
    url: jdbc:postgresql://localhost:5432/rapidos
    username: rapidos
    password: rapidos   # credencial local de demo
  sql:
    init:
      mode: always
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true

server:
  port: 8080

rapidos:
  workers:
    max-size: 4
    core-size: 2
    queue-capacity: 100
  ubicacion:
    store: ${UBICACION_STORE:memoria}      # memoria | firebase
    ttl-segundos: 30
    firebase:
      url: ${FIREBASE_DB_URL:}             # https://<proyecto>-default-rtdb.firebaseio.com
      auth-token: ${FIREBASE_AUTH_TOKEN:}  # opcional; no lo subas al repo
      timeout-ms: 2000
