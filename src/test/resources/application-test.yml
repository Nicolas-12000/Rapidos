# Perfil para integración (PedidoFlujoIT): sin PostgreSQL ni Docker.
spring:
  datasource:
    url: jdbc:h2:mem:rapidos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: false

rapidos:
  persistencia:
    ubicacion: memoria
